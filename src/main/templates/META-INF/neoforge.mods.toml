modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "${mod_name}"
    authors = "${mod_authors}"
    description = '''${mod_description}'''

[[dependencies."${mod_id}"]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies."${mod_id}"]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies."${mod_id}"]]
    modId = "create"
    type = "required"
    versionRange = "[6.0.9,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies."${mod_id}"]]
    modId = "createmoremachines"
    type = "required"
    versionRange = "[${createmoremachines_version},)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies."${mod_id}"]]
    modId = "jei"
    type = "optional"
    versionRange = "[19,)"
    ordering = "NONE"
    side = "BOTH"
